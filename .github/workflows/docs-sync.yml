name: Docs Sync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run workflow from"
        required: true

permissions:
  contents: write

jobs:
  push-doc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.ref_name, 'pre-release') &&
       !contains(github.ref_name, 'testnet'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify rakurai_programs submodule
        run: test -f rakurai_programs/README.md

      - name: Verify jito-protos submodule
        run: |
          test -f jito-protos/protos/packet.proto
          test -f jito-protos/protos/block_engine.proto

      # Overlay submodule program docs under rakurai_docs/rakurai_programs/ only.
      # Do NOT delete rakurai_docs/validators or rakurai_docs/integrators.
      - name: Sync program docs from submodule
        run: |
          mkdir -p rakurai_docs/rakurai_programs/programs/rakurai_activation/idl
          mkdir -p rakurai_docs/rakurai_programs/programs/reward_distribution/idl
          mkdir -p rakurai_docs/rakurai_programs/programs/rakurai_tip_manager/idl
          mkdir -p rakurai_docs/rakurai_programs/cli

          cp rakurai_programs/README.md rakurai_docs/rakurai_programs/README.md
          cp rakurai_programs/programs/rakurai_activation/README.md \
            rakurai_docs/rakurai_programs/programs/rakurai_activation/README.md
          cp rakurai_programs/programs/reward_distribution/README.md \
            rakurai_docs/rakurai_programs/programs/reward_distribution/README.md
          cp rakurai_programs/programs/rakurai_tip_manager/README.md \
            rakurai_docs/rakurai_programs/programs/rakurai_tip_manager/README.md
          cp rakurai_programs/cli/README.md rakurai_docs/rakurai_programs/cli/README.md
          cp rakurai_programs/cli/activation.md \
            rakurai_docs/rakurai_programs/cli/activation.md
          cp rakurai_programs/cli/partner_reward_settlement.md \
            rakurai_docs/rakurai_programs/cli/partner_reward_settlement.md

          cp rakurai_programs/programs/rakurai_activation/idl/*.json \
            rakurai_docs/rakurai_programs/programs/rakurai_activation/idl/ 2>/dev/null || true
          cp rakurai_programs/programs/reward_distribution/idl/*.json \
            rakurai_docs/rakurai_programs/programs/reward_distribution/idl/ 2>/dev/null || true
          cp rakurai_programs/programs/rakurai_tip_manager/idl/*.json \
            rakurai_docs/rakurai_programs/programs/rakurai_tip_manager/idl/ 2>/dev/null || true

      - name: Commit and push program docs to validator repo
        run: |
          git config user.name "saadkhan2495"
          git config user.email "saadkhan2495@gmail.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${{ github.event.repository.default_branch }}"
          fi

          git checkout -B "$BRANCH"
          git add rakurai_docs/rakurai_programs/
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "chore(docs): sync program docs from rakurai_programs submodule"
            git push origin "$BRANCH"
          else
            echo "No program doc changes to commit."
          fi

      - name: Clone central docs repo
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/rakurai-io/rakurai-docs.git

      - name: Copy docs into structured directories
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          DEST=rakurai-docs/docs/services/$REPO_NAME

          rm -rf "$DEST/*"
          mkdir -p "$DEST/rakurai_docs"
          mkdir -p "$DEST/spark-geyser"
          mkdir -p "$DEST/block-rewards-distributor"
          mkdir -p "$DEST/jito-protos/protos"

          # --- Top-level hub ---
          cp README.md "$DEST/README.md"

          # --- rakurai_docs: validators, integrators, synced rakurai_programs ---
          cp -r rakurai_docs/. "$DEST/rakurai_docs/"

          # --- spark-geyser assets ---
          cp spark-geyser/README.md "$DEST/spark-geyser/README.md"
          cp spark-geyser/config.json "$DEST/spark-geyser/config.json"

          # --- post-pack proto assets (for integrator doc links) ---
          cp jito-protos/protos/packet.proto "$DEST/jito-protos/protos/packet.proto"
          cp jito-protos/protos/block_engine.proto "$DEST/jito-protos/protos/block_engine.proto"

          # block rewards distributor
          cp block-rewards-distributor/block_reward_distribution.md "$DEST/block-rewards-distributor/block_reward_distribution.md"

      - name: Commit and push to rakurai-docs
        run: |
          cd rakurai-docs
          git config user.name "saadkhan2495"
          git config user.email "saadkhan2495@gmail.com"
          git add docs/services/${{ github.event.repository.name }}/
          git status --short
          git diff --cached --quiet || git commit -m "Update ${{ github.event.repository.name }} docs"
          git push
