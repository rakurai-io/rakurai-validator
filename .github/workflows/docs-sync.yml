name: Docs Sync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run workflow from"
        required: true

permissions:
  contents: write

jobs:
  push-doc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.ref_name, 'pre-release') &&
       !contains(github.ref_name, 'testnet'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify p2c-protos
        run: |
          test -d p2c-protos/protos
          test -n "$(ls p2c-protos/protos/*.proto 2>/dev/null)"

      - name: Clone central docs repo
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/rakurai-io/rakurai-docs.git

      - name: Copy docs into structured directories
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          DEST=rakurai-docs/docs/services/$REPO_NAME

          # Wipe rather than overwrite: pages renamed or removed in this repo would
          # otherwise survive in rakurai-docs forever and keep publishing stale links.
          rm -rf "$DEST"
          mkdir -p "$DEST/rakurai_docs"
          mkdir -p "$DEST/spark-geyser"
          mkdir -p "$DEST/block-rewards-distributor"
          mkdir -p "$DEST/p2c-protos/protos"

          # --- Top-level hub ---
          cp README.md "$DEST/README.md"

          # --- rakurai_docs: validators, TIN, programs/CLIs as committed here ---
          cp -r rakurai_docs/. "$DEST/rakurai_docs/"

          # --- spark-geyser assets ---
          cp spark-geyser/README.md "$DEST/spark-geyser/README.md"
          cp spark-geyser/config.json "$DEST/spark-geyser/config.json"

          # --- P2C proto assets (markdown links + proto imports for Redocly) ---
          cp p2c-protos/protos/*.proto "$DEST/p2c-protos/protos/"

          # block rewards distributor
          cp block-rewards-distributor/block_reward_distribution.md "$DEST/block-rewards-distributor/block_reward_distribution.md"

      # Markdown in this repo is GitHub-flavored so it renders natively on GitHub:
      # > [!WARNING] callouts and GitHub heading anchors. Redocly needs Markdoc
      # admonitions and keeps '.' and '/' in slugs, so convert the published copy
      # only. This never touches the repo tree.
      - name: Convert published docs to Redocly flavor
        run: |
          DEST=rakurai-docs/docs/services/${{ github.event.repository.name }}
          python3 .github/scripts/rakurai_docs/convert_flavor.py --root "$DEST" --to redocly
          python3 .github/scripts/rakurai_docs/verify_docs.py --root "$DEST" --flavor redocly

      - name: Commit and push to rakurai-docs
        run: |
          cd rakurai-docs
          git config user.name "saadkhan2495"
          git config user.email "saadkhan2495@gmail.com"
          git add docs/services/${{ github.event.repository.name }}/
          git status --short
          git diff --cached --quiet || git commit -m "Update ${{ github.event.repository.name }} docs"
          git push
