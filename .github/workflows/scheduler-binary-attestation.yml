name: Rakurai Scheduler Binary Attestation

on:
    push:
        tags:
            - "*"

env:
  CARGO_TERM_COLOR: always

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
    build:
        strategy:
          matrix:
            os: [ubuntu-22.04, ubuntu-24.04]

        runs-on: ${{ matrix.os }}

        steps:
        - uses: actions/checkout@v4
          with:
            submodules: true 
      
        - name: Clone Scheduler Private Repository
          uses: actions/checkout@v4
          with:
            repository: rakurai-io/scheduler_1_0
            ref: ${{ github.ref_name }}
            token: ${{ secrets.RAKURAI_SCHEDULER }}
            path: core/src/banking_stage/rakurai_scheduler
            submodules: true

        - name: Install Dependencies
          run: |
            rustup update
            sudo apt-get update
            sudo apt-get install libssl-dev libudev-dev pkg-config zlib1g-dev llvm clang cmake make libprotobuf-dev protobuf-compiler libclang-dev

        - name: Build Scheduler Library
          run: |
            git apply core/src/banking_stage/rakurai_scheduler/lib_building.patch
            cargo build --release -p rakurai-scheduler

        - name: Generate artifact attestation
          uses: actions/attest-build-provenance@v3
          with:
            subject-path: 'target/release/librakurai_scheduler_1_0.so'

        - name: Create tar of scheduler library
          run: |
            TAR_NAME="${{ github.ref_name }}_${{ matrix.os }}.tar.gz"
            mkdir -p release
            tar -cvzf $TAR_NAME -C target/release librakurai_scheduler_1_0.so

        - name: Copy binary to Backend
          env:
            BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
            BACKEND_IP: ${{ secrets.BACKEND_IP }}
            BACKEND_USER: ${{ secrets.BACKEND_USER }}
            BACKEND_PATH: ${{ secrets.BACKEND_PATH }}

          run: |
            echo "$BACKEND_SSH_KEY" > backend_key.pem
            chmod 600 backend_key.pem

            TAR_NAME="${{ github.ref_name }}_${{ matrix.os }}.tar.gz"
            scp -o StrictHostKeyChecking=no -i backend_key.pem \
              $TAR_NAME \
              ${BACKEND_USER}@${BACKEND_IP}:${BACKEND_PATH}/

            shred -u backend_key.pem

        - name: Run deployment script on backend
          env:
            BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
            BACKEND_IP: ${{ secrets.BACKEND_IP }}
            BACKEND_USER: ${{ secrets.BACKEND_USER }}
            BACKEND_PATH: ${{ secrets.BACKEND_PATH }}
          run: |
            echo "$BACKEND_SSH_KEY" > backend_key.pem
            chmod 600 backend_key.pem

            ssh -o StrictHostKeyChecking=no -i backend_key.pem ${BACKEND_USER}@${BACKEND_IP} \
              "cd ${BACKEND_PATH}/ && ./deploy_binaries.sh '${{ github.ref_name }}'"

            shred -u backend_key.pem

        - name: Verify binary integrity with objdump
          run: |
            echo "Running objdump verification..."
            OUTPUT=$(objdump -d target/release/librakurai_scheduler_1_0.so | grep -B2 -E 'mov\s+\$0x(00|01|02|03|04|05|06|11|12|15|29|2a|2b|2c|2d|2e|2f|31|32|33|34|36|37|52|57|101),%rax' && objdump -x target/release/librakurai_scheduler_1_0.so | grep -i ClusterInfo || true)
            if [ -z "$OUTPUT" ]; then
              echo "objdump verification successful!"
            else
              echo "objdump verification failed! Unexpected output:"
              echo "$OUTPUT"
              exit 1
            fi