<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1240" width="1600" height="1240" role="img" aria-labelledby="title">
  <title id="title">TIN revenue streams: TCA, PSA, and MCA</title>
  <rect width="1600" height="1240" fill="#ffffff"/>
  <text x="800.00" y="32.72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="26.0" font-weight="700" fill="#0F1C2E"><tspan x="800.00" dy="0.00">Rakurai Transaction Inclusion Network (TIN) Revenue Streams</tspan></text>
  <text x="800.00" y="62.00" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.0" font-weight="400" fill="#5B6B7C"><tspan x="800.00" fill="#5B6B7C">There are three separate revenue streams, each with a dedicated account per service, per validator. Rakurai charges a <a href="https://solscan.io/account/RAkd1EJg45QQHeuXy7JEWBhdNvsd64Z5PbZJWQT96iB?accountName=52adb85c819e027d"><tspan fill="#1A6F8A" text-decoration="underline">commission percentage</tspan></a> and remaining revenue is claimed to the corresponding</tspan><tspan x="800.00" dy="17.92" fill="#5B6B7C">validator identity account.</tspan></text>
  <rect x="24.00" y="84.00" width="1552.00" height="2.00" rx="0.00" fill="#0F1C2E" stroke="none"/>
  <rect x="24.00" y="96.00" width="1552.00" height="458.00" rx="27.48" fill="#FFFFFF" stroke="#D9E0E8"/>
  <rect x="24.00" y="96.00" width="1552.00" height="82.00" rx="0.00" fill="#1A6F8A" stroke="none"/>
  <text x="800.00" y="123.09" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="400" fill="#FFFFFF"><tspan x="800.00" dy="0.00">TCA — Tips Collection Account (Stream 1)</tspan><tspan x="800.00" dy="16.64">One TCA per service, per validator</tspan><tspan x="800.00" dy="16.64">Traders and landing services tip into a tip account. The scheduler uses those tips to prioritize their transactions.</tspan></text>
  <rect x="800.00" y="186.00" width="1.00" height="356.00" rx="0.00" fill="#D9E0E8" stroke="none"/>
  <text x="415.00" y="200.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#0F1C2E"><tspan x="415.00" dy="0.00">· Rakurai Tip Account (Default &amp; Recommended)</tspan></text>
  <rect x="42.00" y="214.00" width="746.00" height="40.00" rx="3.20" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="415.00" y="236.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="415.00" dy="0.00">Trader / landing service tips any of Rakurai’s eight tip accounts</tspan></text>
  <text x="415.00" y="264.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="415.00" dy="0.00">▼</tspan></text>
  <rect x="42.00" y="270.00" width="746.00" height="40.00" rx="3.20" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="415.00" y="292.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="415.00" dy="0.00">Scheduler uses that tip to prioritize the transaction</tspan></text>
  <text x="415.00" y="320.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="415.00" dy="0.00">▼</tspan></text>
  <rect x="42.00" y="326.00" width="746.00" height="52.00" rx="4.16" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="415.00" y="346.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="415.00" dy="0.00">Each leader turn: tip accounts are emptied</tspan><tspan x="415.00" dy="16.64">Rakurai commission is deducted on every leader turn</tspan></text>
  <text x="415.00" y="388.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="415.00" dy="0.00">▼</tspan></text>
  <rect x="42.00" y="394.00" width="746.00" height="40.00" rx="3.20" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="415.00" y="416.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="415.00" dy="0.00">Remaining amount accumulated in validator&#x27;s TCA</tspan></text>
  <text x="415.00" y="444.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="415.00" dy="0.00">▼</tspan></text>
  <rect x="42.00" y="450.00" width="746.00" height="40.00" rx="3.20" fill="#EEF1F5" stroke="#CFD6DE"/>
  <text x="415.00" y="472.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#243447"><tspan x="415.00" dy="0.00">Next epoch → claimed to the validator identity account</tspan></text>
  <text x="1177.00" y="200.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#0F1C2E"><tspan x="1177.00" dy="0.00">· Partner Tip Account (Interim Support)</tspan></text>
  <rect x="804.00" y="214.00" width="746.00" height="52.00" rx="4.16" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="1177.00" y="234.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="1177.00" dy="0.00">You register your own tip account with Rakurai</tspan><tspan x="1177.00" dy="16.64">agreed tip share used for prioritization, minimum 65%</tspan></text>
  <text x="1177.00" y="276.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1177.00" dy="0.00">▼</tspan></text>
  <rect x="804.00" y="282.00" width="746.00" height="40.00" rx="3.20" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="1177.00" y="304.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="1177.00" dy="0.00">Tips land in your account — Rakurai cannot drain them</tspan></text>
  <text x="1177.00" y="332.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1177.00" dy="0.00">▼</tspan></text>
  <rect x="804.00" y="338.00" width="746.00" height="56.00" rx="4.48" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="1177.00" y="360.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="1177.00" dy="0.00">Each leader turn: validator tracks and records the agreed tip share in TCA as an amount owed</tspan><tspan x="1177.00" dy="16.64">no SOL moves yet</tspan></text>
  <text x="1177.00" y="404.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1177.00" dy="0.00">▼</tspan></text>
  <rect x="804.00" y="410.00" width="746.00" height="40.00" rx="3.20" fill="#E6F4F8" stroke="#B7D7E2"/>
  <text x="1177.00" y="432.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1A6F8A"><tspan x="1177.00" dy="0.00">Next epoch → you transfer the owed SOL into the TCA</tspan></text>
  <text x="1177.00" y="460.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1177.00" dy="0.00">▼</tspan></text>
  <rect x="804.00" y="466.00" width="746.00" height="40.00" rx="3.20" fill="#EEF1F5" stroke="#CFD6DE"/>
  <text x="1177.00" y="488.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#243447"><tspan x="1177.00" dy="0.00">Claimed to the validator identity account</tspan></text>
  <text x="1177.00" y="528.52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.0" font-weight="400" fill="#C4564E"><tspan x="1177.00" dy="0.00">If you do not transfer within 2 epochs, that partner tip account will no longer be used for prioritization.</tspan></text>
  <rect x="24.00" y="566.00" width="770.00" height="448.00" rx="26.88" fill="#FFFFFF" stroke="#D9E0E8"/>
  <rect x="24.00" y="566.00" width="770.00" height="82.00" rx="0.00" fill="#B45309" stroke="none"/>
  <text x="409.00" y="593.09" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="400" fill="#FFFFFF"><tspan x="409.00" dy="0.00">PSA — P2C Subscription Account (Stream 2)</tspan><tspan x="409.00" dy="16.64">One PSA per service, per validator</tspan><tspan x="409.00" dy="16.64">Prepaid access fee to use the post-pack confirmations (Step-1 for Backrun)</tspan></text>
  <text x="409.00" y="673.00" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="400" fill="#0F1C2E"><tspan x="409.00" dy="0.00">A prepaid subscription fee deducted from PSA based on the validator&#x27;s SOL stake. Paying this fee</tspan><tspan x="409.00" dy="16.64">gives you access to post-pack confirmation (P2C) updates. Backrun profits are shared separately</tspan><tspan x="409.00" dy="16.64">through the MCA.</tspan></text>
  <rect x="38.00" y="718.00" width="742.00" height="36.00" rx="2.88" fill="#FEF3E6" stroke="#F0D0A8"/>
  <text x="409.00" y="738.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#B45309"><tspan x="409.00" dy="0.00">Rakurai creates a PSA (one PSA per service, per validator)</tspan></text>
  <text x="409.00" y="763.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="409.00" dy="0.00">▼</tspan></text>
  <rect x="38.00" y="764.00" width="742.00" height="44.00" rx="3.52" fill="#FEF3E6" stroke="#F0D0A8"/>
  <text x="409.00" y="780.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#B45309"><tspan x="409.00" dy="0.00">PSA is funded with prepaid SOL</tspan><tspan x="409.00" dy="16.64">any wallet can fund the account</tspan></text>
  <text x="409.00" y="813.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="409.00" dy="0.00">▼</tspan></text>
  <rect x="38.00" y="818.00" width="742.00" height="36.00" rx="2.88" fill="#FEF3E6" stroke="#F0D0A8"/>
  <text x="409.00" y="838.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#B45309"><tspan x="409.00" dy="0.00">Service receives post-pack confirmations from the validator</tspan></text>
  <text x="409.00" y="863.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="409.00" dy="0.00">▼</tspan></text>
  <rect x="38.00" y="868.00" width="742.00" height="50.00" rx="4.00" fill="#FEF3E6" stroke="#F0D0A8"/>
  <text x="409.00" y="887.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#B45309"><tspan x="409.00" dy="0.00">Epoch ends → fee deducted from PSA</tspan><tspan x="409.00" dy="16.64">amount based on the validator&#x27;s staked SOL</tspan></text>
  <text x="409.00" y="927.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="409.00" dy="0.00">▼</tspan></text>
  <rect x="38.00" y="932.00" width="742.00" height="36.00" rx="2.88" fill="#EEF1F5" stroke="#CFD6DE"/>
  <text x="409.00" y="952.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#243447"><tspan x="409.00" dy="0.00">Next epoch → fee claimed to the validator identity account</tspan></text>
  <text x="409.00" y="992.52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.0" font-weight="400" fill="#C4564E"><tspan x="409.00" dy="0.00">If the prepaid balance is too low: there is a 2-epoch grace period, after which the P2C stream will stops.</tspan></text>
  <rect x="806.00" y="566.00" width="770.00" height="448.00" rx="26.88" fill="#FFFFFF" stroke="#D9E0E8"/>
  <rect x="806.00" y="566.00" width="770.00" height="82.00" rx="0.00" fill="#1F7A4D" stroke="none"/>
  <text x="1191.00" y="593.09" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="400" fill="#FFFFFF"><tspan x="1191.00" dy="0.00">MCA — MevShare Collection Account (Stream 3)</tspan><tspan x="1191.00" dy="16.64">One MCA per service, per validator</tspan><tspan x="1191.00" dy="16.64">Share backrun profit from post-pack confirmations (Step-2 for Backrun)</tspan></text>
  <text x="1191.00" y="673.00" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="400" fill="#0F1C2E"><tspan x="1191.00" dy="0.00">After paying the PSA subscription fee, you can access pre-execution (P2C) transactions streamed from</tspan><tspan x="1191.00" dy="16.64">the point of no return and use them for backrun. The resulting profit is shared with the validator</tspan><tspan x="1191.00" dy="16.64">through the MCA.</tspan></text>
  <rect x="820.00" y="718.00" width="742.00" height="50.00" rx="4.00" fill="#E7F6EE" stroke="#B7DDC6"/>
  <text x="1191.00" y="737.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1F7A4D"><tspan x="1191.00" dy="0.00">Rakurai creates a MCA (one MCA per service, per validator)</tspan><tspan x="1191.00" dy="16.64">Service holds the key that reports backrun RevShare</tspan></text>
  <text x="1191.00" y="777.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1191.00" dy="0.00">▼</tspan></text>
  <rect x="820.00" y="782.00" width="742.00" height="50.00" rx="4.00" fill="#E7F6EE" stroke="#B7DDC6"/>
  <text x="1191.00" y="801.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1F7A4D"><tspan x="1191.00" dy="0.00">During the epoch: you trade as usual</tspan><tspan x="1191.00" dy="16.64">nothing is taken automatically — profit stays with you</tspan></text>
  <text x="1191.00" y="837.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1191.00" dy="0.00">▼</tspan></text>
  <rect x="820.00" y="838.00" width="742.00" height="48.00" rx="3.84" fill="#E7F6EE" stroke="#B7DDC6"/>
  <text x="1191.00" y="856.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1F7A4D"><tspan x="1191.00" dy="0.00">Backrun RevShare reporting by service</tspan><tspan x="1191.00" dy="16.64">Pay-as-you-go throughout the epoch or once at epoch end</tspan></text>
  <text x="1191.00" y="891.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1191.00" dy="0.00">▼</tspan></text>
  <rect x="820.00" y="892.00" width="742.00" height="48.00" rx="3.84" fill="#E7F6EE" stroke="#B7DDC6"/>
  <text x="1191.00" y="910.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#1F7A4D"><tspan x="1191.00" dy="0.00">Backrun RevShare transferred to MCA</tspan><tspan x="1191.00" dy="16.64">Pay-as-you-go or as one accumulated transfer at epoch end</tspan></text>
  <text x="1191.00" y="945.31" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.0" font-weight="400" fill="#5B6B7C"><tspan x="1191.00" dy="0.00">▼</tspan></text>
  <rect x="820.00" y="946.00" width="742.00" height="36.00" rx="2.88" fill="#EEF1F5" stroke="#CFD6DE"/>
  <text x="1191.00" y="966.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#243447"><tspan x="1191.00" dy="0.00">Next epoch → RevShare claimed to the validator identity account</tspan></text>
  <text x="1191.00" y="1006.52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.0" font-weight="400" fill="#C4564E"><tspan x="1191.00" dy="0.00">If you do not report and send backrun revshare within 2 epochs, you&#x27;ll stop receiving post-pack transactions.</tspan></text>
  <rect x="24.00" y="1026.00" width="1552.00" height="122.00" rx="7.32" fill="#F6F8FB" stroke="#D9E0E8"/>
  <text x="800.00" y="1042.94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.0" font-weight="700" fill="#0F1C2E"><tspan x="800.00" dy="0.00">Where the money ends up</tspan></text>
  <rect x="40.00" y="1054.00" width="169.81" height="48.00" rx="3.84" fill="#1A6F8A" stroke="none"/>
  <text x="124.90" y="1080.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#FFFFFF"><tspan x="124.90" dy="0.00">TCA-Tips</tspan></text>
  <rect x="215.81" y="1054.00" width="169.81" height="48.00" rx="3.84" fill="#B45309" stroke="none"/>
  <text x="300.71" y="1080.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#FFFFFF"><tspan x="300.71" dy="0.00">PSA-Fee</tspan></text>
  <rect x="391.62" y="1054.00" width="169.81" height="48.00" rx="3.84" fill="#1F7A4D" stroke="none"/>
  <text x="476.52" y="1080.73" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#FFFFFF"><tspan x="476.52" dy="0.00">MCA-Revshare</tspan></text>
  <text x="575.42" y="1081.78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18.0" font-weight="700" fill="#5B6B7C"><tspan x="575.42" dy="0.00">→</tspan></text>
  <rect x="589.42" y="1054.00" width="401.10" height="48.00" rx="3.84" fill="#243447" stroke="none"/>
  <text x="789.97" y="1072.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#FFFFFF"><tspan x="789.97" dy="0.00">Claim to validator identity account</tspan><tspan x="789.97" dy="16.64">after Rakurai’s commission</tspan></text>
  <text x="1004.52" y="1081.78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18.0" font-weight="700" fill="#5B6B7C"><tspan x="1004.52" dy="0.00">→</tspan></text>
  <rect x="1018.52" y="1054.00" width="541.48" height="48.00" rx="3.84" fill="#243447" stroke="none"/>
  <text x="1289.26" y="1072.41" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.0" font-weight="700" fill="#FFFFFF"><tspan x="1289.26" dy="0.00">Optional: convert to Block Reward using high-priority transactions during</tspan><tspan x="1289.26" dy="16.64">the leader turn</tspan></text>
  <text x="800.00" y="1126.52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.0" font-weight="400" fill="#C4564E"><tspan x="800.00" dy="0.00">Revenue Double-Counting: To prevent revenue from being counted twice when converted to Block Rewards, tools and indexers should verify the block_reward_conversion_enabled flag in the respective TCA, PSA, and MCA accounts.</tspan></text>
  <text x="664.16" y="1172.20" font-family="Segoe UI, system-ui, sans-serif" font-size="12.0" font-weight="700" fill="#1A6F8A"><tspan>· </tspan><a href="https://docs.rakurai.io"><tspan fill="#1A6F8A" text-decoration="underline">Rakurai Docs</tspan></a><tspan>     · </tspan><a href="https://docs.rakurai.io/docs/services/rakurai_jito_private/rakurai_docs/transaction_inclusion/rakurai_tip_manager_faqs#appendix-program-and-tip-account-addresses"><tspan fill="#1A6F8A" text-decoration="underline">Rakurai Tip Accounts</tspan></a></text>
</svg>
