[package]
name = "agave-jemalloc"
description = "Agave jemalloc utilities"
documentation = "https://docs.rs/agave-jemalloc"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[lib]
crate-type = ["lib"]
name = "agave_jemalloc"

[features]
agave-unstable-api = []
# Rakurai: links tikv-jemalloc-sys. Enabled through solana-core's `jemalloc-stats` feature (validator
# build). Left off for the rakurai scheduler cdylib, where a statically linked jemalloc would take
# over the library's malloc and split the heap with the host process.
jemalloc = ["dep:jemalloc-ctl", "dep:jemalloc-sys", "dep:jemallocator"]
metrics = ["dep:log", "dep:solana-metrics"]

[dependencies]
jemalloc-ctl = { workspace = true, optional = true }
jemalloc-sys = { workspace = true, optional = true }
jemallocator = { workspace = true, optional = true }
log = { workspace = true, optional = true }
solana-metrics = { workspace = true, optional = true }
thiserror = { workspace = true }

[lints]
workspace = true
